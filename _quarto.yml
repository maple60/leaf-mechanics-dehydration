profile:
  group:
    - [en, ja]

project:
  type: book
  execute-dir: project
  output-dir: _site
  resources:
    - R/plot_gam_ci.R
    - R/summarize_trait.R
    - R/plot_submission_panels.R
    - R/add_tensile_stiffness.R
    - outputs/figures/submission/generate_figures.qmd
    - outputs/figures/submission/*.pdf

book:
  title: "Leaf Mechanics under Dehydration"
  author: "Kaede Konrai"

number-sections: false
filters:
  - filters/language-title.lua
execute:
  echo: true
  freeze: false
format:
  html:
    css: language-switch.css
    include-after-body: language-switch.html
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true
    code-overflow: wrap
    fig-format: svg
